[package]
name = "logoo"
description = "LOGOO for Mac: a native window around the LOGOO app."
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "logoo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
# Turned on by `tauri build`. Serves the bundled start page instead of devUrl.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
